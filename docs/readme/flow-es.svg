<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
<title id="t">LinkedIn Automation Template</title>
<desc id="d">1 INFOGRAFÍA → EDUCATIVO / CON DATOS / OPINIÓN / CASO → TU EDICIÓN → LINKEDIN</desc>
<style>@font-face{font-family:JzOutfit;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.o{font-family:JzOutfit,Outfit,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.i{font-family:JzInter,Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.rise{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade .5s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
.flash{opacity:0;animation:flash .45s ease-out both}
.pt{opacity:0}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.frame{stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 1.3s cubic-bezier(.65,0,.35,1) .05s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){.frame{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="xp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B35"/><stop offset="1" stop-color="#FFA500"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FF6B35" stroke-opacity=".07"/></pattern>
</defs>

